server:
  port: 8080
  
app:
  cors:
    allowed-origins: "http://localhost:4200"
  frontend:
    base-url: "http://localhost:4200"
  backend:
    base-url: "http://localhost:8080"    

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          strava:
            client-id: ${STRAVA_CLIENT_ID}
            client-secret: ${STRAVA_CLIENT_SECRET}
            scope: activity:read_all
            token-name: access_token
            authentication-scheme: query
            client-authentication-scheme: form
            client-authentication-method: post
            client-name: Strava
            redirect-uri: "${app.backend.base-url}/exchange_token"
            authorization-grant-type: authorization_code
        provider:
          strava:
            authorization-uri: https://www.strava.com/oauth/authorize
            token-uri: https://www.strava.com/oauth/token
            user-info-uri: https://www.strava.com/api/v3/athlete
            user-name-attribute: id